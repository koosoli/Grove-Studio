[package]
name = "grove-studio"
version = "0.1.6"
edition = "2021"
description = "A procedural tree workshop with a WebGPU preview and glTF/OBJ export, plus a headless CLI and MCP server"
license = "GPL-3.0-or-later"
repository = "https://github.com/koosoli/grove-studio"
readme = "README.md"
# Depends on git-pinned Solstice crates, which crates.io does not accept.
publish = false

[dependencies]
block_compression = { version = "0.11", default-features = false, features = ["bc15"] }
macroquad = { version = "0.4.14", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.30"
image = { version = "0.24", default-features = false, features = ["png"] }
pollster = "0.4"
solstice-asset = { git = "https://github.com/SamG-Coder/solstice.git", rev = "c347879d8f6b97a850db004ecfd6a9c5cf29768b" }
solstice-builder = { git = "https://github.com/SamG-Coder/solstice.git", rev = "c347879d8f6b97a850db004ecfd6a9c5cf29768b" }
solstice-procgen = { path = "vendor/solstice-procgen" }
solstice-render = { path = "vendor/solstice-render" }
wgpu = "30"
meshopt = "0.7"

[profile.dev.package.solstice-builder]
opt-level = 3

[profile.release]
lto = "thin"
strip = true
